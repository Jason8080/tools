# SseIm Framework 默认配置
sse-im:
  sse:
    enabled: true
    base-path: /sse
    heartbeat-interval: 15s
    max-connections-per-topic: 10000
    max-total-connections: 100000
    buffer-size: 1024
    connection-timeout: 0s
    replay-enabled: true
    max-replay-events: 200
    retry-millis: 5000

  stream:
    enabled: false                          # 多实例同步（需引入 Spring Cloud Stream Binder）
    broadcast-destination: sse-im-broadcast # 广播目标名
    consumer-prefetch: 250                  # 消费者预取数（覆盖 SCS 默认的 1）
    consumer-concurrency: 4                 # 消费者并发数
    skip-self-messages: true                # 跳过本实例发出的消息

